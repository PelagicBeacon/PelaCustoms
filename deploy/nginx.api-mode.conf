# ============================================================
# PelaCustoms · API 模式配置（单页应用 / 前后端分离）
# ============================================================
# 与 nginx.conf.sample（页面模式）的差别只有三点：
#   1. 只保护 /api/，不保护页面 —— 单页应用的页面只是 index.html，
#      攻击者根本不请求它，真正昂贵的是接口。
#   2. 拒绝时保留 401，不改写成 200 —— 页面模式那个 =200 会让 fetch
#      判定 res.ok === true，随后把质询页 HTML 当 JSON 解析失败。
#   3. 用 X-PC-Challenge 头把「该质询」和「后端自己的 401」分开。
#
# 前置条件（缺一条就不要照抄）：
#   - 源站是 nginx，且编译了 --with-http_auth_request_module
#     （nginx -V 2>&1 | grep -o with-http_auth_request_module）
#   - 接口与页面同源。若接口在独立域名，见文末「跨域接口」
#   - 站点没有会拦截 /api/ 的 Service Worker
#
# 回滚：删掉主配置里对本文件的 include，或者去掉 /api/ 里那几行
#       auth_request / add_header，nginx -t && nginx -s reload 即可。
# ============================================================

log_format pc '$remote_addr - [$time_local] "$request" $status '
              'rid=$request_id reason=$upstream_http_x_pc_reason';
access_log /var/log/nginx/pc.access.log pc;

upstream pelacustoms {
    server 127.0.0.1:8090;
    keepalive 16;
}

upstream app_backend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name example.com;

    # ---------- ① 判定子请求：不带 body，只带判定需要的头 ----------
    location = /__pc/auth {
        internal;
        proxy_pass http://pelacustoms/__pc/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header X-Original-URI     $request_uri;
        proxy_set_header X-Original-Method  $request_method;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # 覆盖而不是追加：不要让客户端自带的头污染判定
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header User-Agent         $http_user_agent;

        proxy_http_version 1.1;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }

    # ---------- ② 质询页与静态资源：必须绕过判定 ----------
    # 少了这一段就是死循环：判定子请求自身也会被判定。
    location ^~ /__pc/ {
        proxy_pass http://pelacustoms;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Request-ID      $request_id;
        proxy_http_version 1.1;
    }

    # ---------- ③ 接口：这里是唯一真正被保护的地方 ----------
    # 路径按实际接口前缀改。若接口分散在 /api/ 与 /v1/，
    # 把 location 改成 regex：  location ~ ^/(api|v1)/ { ... }
    location ^~ /api/ {
        auth_request /__pc/auth;

        # 子请求的响应头取到本请求里。auth_request_set 必须写在
        # 使用它的 add_header 之前 —— 否则 nginx -t 会报 unknown variable。
        auth_request_set $pc_deny   $upstream_http_x_pc_deny;
        auth_request_set $pc_reason $upstream_http_x_pc_reason;

        # 变量为空时 nginx 不发送该头。于是：
        #   判定拒绝     -> 401 + X-PC-Challenge: required  -> 前端去质询
        #   后端自己 401 -> 401，无该头                    -> 前端按登录过期处理
        # 这两个必须分开，否则应用层 401 会触发质询，绕过质询后重试仍是
        # 401，再次触发质询，形成死循环。
        add_header X-PC-Challenge $pc_deny   always;
        add_header X-PC-Reason    $pc_reason always;
        add_header Cache-Control  "no-store"  always;

        proxy_pass http://app_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;

        # AI 类接口耗时可能到分钟级，别被默认 60s 切断
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ---------- ④ 页面与静态资源：不拦 ----------
    # 单页应用的壳子是公开的，拦它只会平白引入 Service Worker 与
    # CDN 缓存的风险，没有收益。
    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # 若壳子由磁盘直接提供，换成：
        #   root /var/www/site;
        #   try_files $uri /index.html;
    }
}

# ============================================================
# 前端配套（必做，不是可选项）
# ============================================================
# 1. 拦截器分流
#
#    if (res.status === 401 && res.headers.get('X-PC-Challenge')) {
#      location.href =
#        '/__pc/challenge?rd=' + encodeURIComponent(
#          location.pathname + location.search);
#      throw new Error('clearance_required');
#    }
#
# 2. 过关后回到原页面，由用户重新触发那次操作。
#    接口被拦的请求体无法恢复（子请求不带 body），不要指望自动重放 POST。
#    真正的解法是「发出前确认有通行证」：
#
#    async function ensureClearance() {
#      const r = await fetch('/__pc/auth', {
#        headers: { 'X-Original-URI': location.pathname },
#      });
#      if (r.ok) return true;
#      location.href = '/__pc/challenge?rd=' +
#        encodeURIComponent(location.pathname);
#      return false;
#    }
#
# 3. 通行证是无状态 HMAC，没有「续期」，过期只能重新过一次。
#    做题中途被弹出去体验很差，把 TTL 调长（customs.toml 里
#    ttl = "2h"），或在空闲时用隐藏 iframe 预热 /__pc/challenge。
#
# ============================================================
# 跨域接口（接口在独立域名时）
# ============================================================
# 例如页面在 www.example.com、接口在 api.example.com：
#   - 给 api.example.com 的 server 块也加同样的 /__pc/auth 与 /__pc/，
#     质询页必须由该域名自己发出，否则 cookie 落不到这个域。
#   - customs.toml 中该站点 clearance.domain 留空（host-only），
#     或显式写 ".example.com" 让两域共用。
#   - 跨域时浏览器默认不发送 cookie，必须 same_site = "None"、
#     secure = true，前端 fetch 加 credentials: 'include'，
#     且后端 CORS 需要 Access-Control-Allow-Credentials: true。
#     SameSite=None 必须配 Secure，纯 http 环境下不生效。
#
# ============================================================
# 已知限制
# ============================================================
# - 只挡住匿名脚本。有账号的用户可以直接调接口，配额与成本控制
#   需要在应用层做（per-user 限流、输入长度限制、结果缓存）。
# - 不防 DDoS，不省带宽，不隐藏源站 —— 这些只有边缘才能做到。
# - 判定实例是单进程（gunicorn -w 1），它的吞吐就是本机的天花板。
